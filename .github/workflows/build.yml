name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Configurar
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --parallel

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: brew install sdl2 sdl2_image sdl2_mixer

      - name: Configurar
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --parallel
